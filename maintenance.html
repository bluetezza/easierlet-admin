<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A4D3C">
  <title>Open maintenance — easierLet Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>

<div id="admin-header"></div>

<main class="admin-main">
  <div class="page-head">
    <h1>Open maintenance</h1>
    <div class="sub">Maintenance requests across the platform that haven't been completed, cancelled or rejected.</div>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title" id="cardTitle">All open requests</div>
        <div class="card-sub">Newest first.</div>
      </div>
    </div>
    <div id="rows"><div class="spinner"></div></div>
  </div>
</main>

<script type="module">
  import "/assets/admin.js?v=10";
  const ADMIN = window.ADMIN;
  const $ = (id) => document.getElementById(id);

  const admin = await ADMIN.requireAdminSession();
  if (!admin) throw new Error("redirecting");
  ADMIN.mountHeader("dashboard", admin);

  function alertBox(kind, msg) { const a = $("alertBox"); a.className = `alert ${kind}`; a.textContent = msg; }

  function statusPill(s) {
    const map = {
      new: "blue", acknowledged: "blue", awaiting_info: "orange",
      scheduled: "green", in_progress: "green",
    };
    return `<span class="pill pill-${map[s] || 'grey'}">${ADMIN.esc(s.replace(/_/g, ' '))}</span>`;
  }

  async function load() {
    try {
      const data = await ADMIN.api("list_admin_maintenance");
      const items = data.items || [];
      $("cardTitle").textContent = `${items.length} open request${items.length === 1 ? '' : 's'}`;
      if (!items.length) {
        $("rows").innerHTML = `<div class="empty">Nothing open right now.</div>`;
        return;
      }
      $("rows").innerHTML = `
        <table class="table">
          <thead>
            <tr>
              <th>Opened</th><th>Landlord</th><th>Property</th><th>Title</th>
              <th>Trade</th><th>Priority</th><th>Status</th><th>Scheduled</th><th></th>
            </tr>
          </thead>
          <tbody>${items.map((m) => {
            const ll = m.landlord || {};
            const llName = ll.director_name || ll.contact_email || "—";
            const prop = m.property || {};
            const addr = [prop.address_line1, prop.city, prop.postcode].filter(Boolean).join(", ") || "—";
            const llHref = `/landlord.html?id=${ADMIN.esc(m.user_id)}`;
            const propHref = m.property_id ? `/property.html?id=${ADMIN.esc(m.property_id)}` : null;
            return `
              <tr>
                <td>${ADMIN.relTime(m.created_at)}</td>
                <td><a href="${llHref}">${ADMIN.esc(llName)}</a></td>
                <td>${propHref ? `<a href="${propHref}">${ADMIN.esc(addr)}</a>` : ADMIN.esc(addr)}</td>
                <td>${ADMIN.esc(m.title || "—")}</td>
                <td>${m.trade_type ? `<code style="font-size:12px">${ADMIN.esc(m.trade_type)}</code>` : '<span style="color:var(--el-muted)">untriaged</span>'}</td>
                <td>${m.priority ? ADMIN.esc(m.priority) : "—"}</td>
                <td>${statusPill(m.status)}</td>
                <td>${m.scheduled_date ? ADMIN.fmtDate(m.scheduled_date) : "—"}</td>
                <td>${propHref ? `<a class="btn btn-secondary" href="${propHref}">Open</a>` : ""}</td>
              </tr>`;
          }).join("")}</tbody>
        </table>
      `;
    } catch (e) {
      alertBox("error", e.message || "Failed to load maintenance.");
    }
  }
  load();
</script>

</body>
</html>
