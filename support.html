<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A4D3C">
  <title>Support — easierLet Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/assets/admin.css">

  <style>
    .seg { display: inline-flex; background: #E5EAE7; padding: 4px; border-radius: 999px; gap: 4px; margin-bottom: 16px; }
    .seg button { background: transparent; border: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--el-muted); font-family: inherit; }
    .seg button.active { background: white; color: var(--el-green, #1A6B55); font-weight: 600; }

    .ticket-row { display:flex; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--el-line); cursor:pointer; }
    .ticket-row:hover .subj { color: var(--el-green); }
    .ticket-row .meta { flex:1; }
    .ticket-row .subj { font-weight:600; }
    .ticket-row .sub  { font-size:12px; color:var(--el-muted); margin-top:2px; }

    .pill { font-size:11px; font-weight:600; padding:3px 8px; border-radius:999px; }
    .pill-open       { background:#FFF8EC; color:#8A6000; }
    .pill-awaiting   { background:#E5F1EC; color:#1A6B55; }
    .pill-progress   { background:#DCEEFA; color:#22577A; }
    .pill-closed     { background:#E5EAE7; color:#6B8278; }
    .pill-plan       { background:#F5F7F5; color:var(--el-ink); border:1px solid var(--el-line); }

    .msg { padding:14px; border-radius:10px; margin-bottom:10px; }
    .msg.from-user   { background:#F5F7F5; }
    .msg.from-admin  { background:#E5F1EC; border-left:3px solid var(--el-green, #1A6B55); }
    .msg.from-system { background:#F0F0EE; font-style:italic; color:var(--el-muted); font-size:12px; }
    .msg.internal    { background:#FFF8EC; border-left:3px solid #F0D080; }
    .msg-head { font-size:12px; color:var(--el-muted); margin-bottom:6px; }
    .msg-body { white-space:pre-wrap; line-height:1.5; }

    textarea.adm { width:100%; padding:12px; border:1px solid var(--el-line); border-radius:10px; min-height:120px; font-family:inherit; font-size:14px; }

    .status-opt { display:inline-flex; }
    .status-opt input { position:absolute; opacity:0; pointer-events:none; }
    .status-opt span {
      display:inline-block; padding:6px 12px; border-radius:999px;
      border:1px solid var(--el-green-border, #C4DDD6); background:#fff;
      font-size:13px; color:var(--el-ink); cursor:pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }
    .status-opt:hover span { border-color: var(--el-green, #1A6B55); }
    .status-opt input:checked + span {
      background: var(--el-green, #1A6B55); color:#fff; border-color: var(--el-green, #1A6B55);
      font-weight:600;
    }
    .status-opt input:focus-visible + span { outline: 2px solid var(--el-green, #1A6B55); outline-offset: 2px; }
    #statusRow.is-internal { opacity: 0.5; }
    #statusRow.is-internal::after {
      content: 'Internal notes don\'t change ticket status'; display:block;
      font-size:12px; color:var(--el-muted); flex-basis:100%; margin-top:4px;
    }
  </style>
</head>
<body>

<div id="admin-header"></div>

<main class="admin-main">
  <div class="page-head">
    <h1>Support</h1>
    <div class="sub">Tickets opened by landlords. Replies email the user automatically.</div>
  </div>

  <div class="alert" id="alertBox"></div>

  <div id="listView">
    <div class="card">
      <div class="card-head">
        <div>
          <div class="seg" role="tablist">
            <button data-status=""               class="active">All open</button>
            <button data-status="open">New</button>
            <button data-status="awaiting_user">Awaiting user</button>
            <button data-status="in_progress">In progress</button>
            <button data-status="closed">Closed</button>
          </div>
        </div>
      </div>
      <div id="ticketList"></div>
    </div>
  </div>

  <div id="threadView" style="display:none">
    <a href="#" id="backLink" class="row-link">← All tickets</a>
    <div class="card" style="margin-top:14px">
      <div class="card-head">
        <div>
          <div class="card-title" id="thSubject">—</div>
          <div class="card-sub" id="thMeta">—</div>
        </div>
        <button class="btn btn-secondary" id="closeNoReplyBtn">Close ticket (no reply)</button>
      </div>
      <div id="messageList"></div>
      <div style="margin-top:14px;border-top:1px solid var(--el-line);padding-top:14px">
        <textarea class="adm" id="replyBody" placeholder="Reply to the landlord…"></textarea>

        <div id="statusRow" style="margin-top:14px;background:var(--el-green-pale);border:1px solid var(--el-green-border, #C4DDD6);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <span style="font-size:13px;font-weight:600;color:var(--el-green);text-transform:uppercase;letter-spacing:0.5px">After sending →</span>
          <div role="radiogroup" id="statusOptions" style="display:inline-flex;gap:6px;flex-wrap:wrap">
            <label class="status-opt"><input type="radio" name="newStatusRadio" value="awaiting_user" checked><span>Awaiting user</span></label>
            <label class="status-opt"><input type="radio" name="newStatusRadio" value="in_progress"><span>In progress</span></label>
            <label class="status-opt"><input type="radio" name="newStatusRadio" value="closed"><span>Close ticket</span></label>
            <label class="status-opt"><input type="radio" name="newStatusRadio" value=""><span>Don't change</span></label>
          </div>
        </div>

        <div style="margin-top:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="internalChk"> Internal note (not sent to landlord)</label>
          <button class="btn btn-primary" id="sendReplyBtn" style="margin-left:auto">Send reply</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="module">
import "/assets/admin.js?v=7";
const ADMIN = window.ADMIN;
const $ = (id) => document.getElementById(id);

const admin = await ADMIN.requireAdminSession();
if (!admin) throw new Error("redirecting");
ADMIN.mountHeader("support", admin);

let activeStatus = "";  // "" = all open
let activeTicketId = new URLSearchParams(location.search).get("id");

function alertBox(kind, msg) {
  const a = $("alertBox"); a.className = `alert ${kind}`; a.textContent = msg;
  setTimeout(() => { a.className = "alert"; a.textContent = ""; }, 5000);
}

function pill(status) {
  const map = {
    open: '<span class="pill pill-open">Open</span>',
    awaiting_user: '<span class="pill pill-awaiting">Awaiting user</span>',
    in_progress: '<span class="pill pill-progress">In progress</span>',
    closed: '<span class="pill pill-closed">Closed</span>',
  };
  return map[status] || `<span class="pill pill-open">${ADMIN.esc(status)}</span>`;
}

function fmt(iso) {
  if (!iso) return "—";
  const d = new Date(iso); if (isNaN(d.getTime())) return iso;
  return d.toLocaleString("en-GB", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

function showView(name) {
  $("listView").style.display = name === "list" ? "" : "none";
  $("threadView").style.display = name === "thread" ? "" : "none";
}

// ── List ─────────────────────────────────────────────────────────────────
async function loadList() {
  const params = activeStatus ? { status: activeStatus } : {};
  let res;
  try {
    res = await ADMIN.api("list_support_tickets", params);
  } catch (e) {
    $("ticketList").innerHTML = `<div class="alert error">${ADMIN.esc(e.message)}</div>`;
    return;
  }
  const tickets = res.tickets || [];
  // For "All open" we only show non-closed
  const visible = activeStatus === "" ? tickets.filter(t => t.status !== "closed") : tickets;
  if (visible.length === 0) {
    $("ticketList").innerHTML = `<div class="empty">No tickets here.</div>`;
    return;
  }
  $("ticketList").innerHTML = visible.map(t => {
    const planTag = t.plan_at_open ? `<span class="pill pill-plan" style="margin-left:8px">${ADMIN.esc(t.plan_at_open)}</span>` : "";
    const lname = t.landlord?.director_name || t.landlord?.contact_email || t.user_id;
    return `
      <div class="ticket-row" data-id="${ADMIN.esc(t.id)}">
        <div class="meta">
          <div class="subj">${ADMIN.esc(t.subject)} ${planTag}</div>
          <div class="sub">${ADMIN.esc(lname)} · ${ADMIN.esc((t.category || "general"))} · updated ${ADMIN.esc(fmt(t.updated_at))}</div>
        </div>
        ${pill(t.status)}
      </div>
    `;
  }).join("");
  document.querySelectorAll(".ticket-row").forEach(el => el.addEventListener("click", () => openThread(el.dataset.id)));
}

// ── Thread ───────────────────────────────────────────────────────────────
async function openThread(id) {
  activeTicketId = id;
  history.replaceState({}, "", `?id=${encodeURIComponent(id)}`);
  showView("thread");
  $("messageList").innerHTML = `<div class="empty">Loading…</div>`;
  let res;
  try { res = await ADMIN.api("view_support_ticket", { ticket_id: id }); }
  catch (e) { alertBox("error", e.message); return; }

  const t = res.ticket;
  const ll = res.landlord || {};
  const llName = ll.director_name || ll.contact_email || t.user_id;
  $("thSubject").textContent = t.subject;
  $("thMeta").innerHTML = `${pill(t.status)} · ${ADMIN.esc(llName)} ${ll.contact_email ? `&lt;${ADMIN.esc(ll.contact_email)}&gt;` : ""} · plan ${ADMIN.esc(t.plan_at_open || "—")} · opened ${ADMIN.esc(fmt(t.created_at))} · category ${ADMIN.esc(t.category || "—")}`;
  // Hide the close-without-reply button on already-closed tickets.
  $("closeNoReplyBtn").style.display = (t.status === "closed") ? "none" : "";

  const msgs = res.messages || [];
  $("messageList").innerHTML = msgs.map(m => {
    const who = m.author_type === "admin" ? "EasierLet support" : (m.author_type === "system" ? "System" : llName);
    const cls = m.internal ? "internal" : (`from-${m.author_type}`);
    const tag = m.internal ? `<span class="pill pill-plan" style="background:#FFF8EC;color:#8A6000;border:none;margin-left:6px">internal note</span>` : "";
    return `
      <div class="msg ${cls}">
        <div class="msg-head"><strong>${ADMIN.esc(who)}</strong>${tag} · ${ADMIN.esc(fmt(m.created_at))}</div>
        <div class="msg-body">${ADMIN.esc(m.body)}</div>
      </div>
    `;
  }).join("");
}

$("backLink").addEventListener("click", (e) => { e.preventDefault(); activeTicketId = null; history.replaceState({}, "", "/support.html"); showView("list"); });

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("active", x === b));
  activeStatus = b.dataset.status;
  loadList();
}));

function selectedStatus() {
  const checked = document.querySelector('input[name="newStatusRadio"]:checked');
  return checked && checked.value ? checked.value : undefined;
}
function resetStatusToDefault() {
  document.querySelectorAll('input[name="newStatusRadio"]').forEach(r => { r.checked = (r.value === "awaiting_user"); });
}

// Internal notes don't flip ticket status — gray the picker out so it's
// obvious nothing will happen.
$("internalChk").addEventListener("change", () => {
  const internal = $("internalChk").checked;
  document.getElementById("statusRow").classList.toggle("is-internal", internal);
  document.querySelectorAll('input[name="newStatusRadio"]').forEach(r => { r.disabled = internal; });
});

$("closeNoReplyBtn").addEventListener("click", async () => {
  if (!activeTicketId) return;
  const reason = window.prompt("Optional note for the user (left blank, the system message just says \"Ticket closed by support\"):", "") ?? "";
  if (reason === null) return; // user cancelled
  const btn = $("closeNoReplyBtn"); btn.disabled = true; btn.textContent = "Closing…";
  try {
    await ADMIN.api("close_support_ticket", { ticket_id: activeTicketId, reason: reason.trim() });
    await openThread(activeTicketId);
    await loadList();
  } catch (e) {
    alertBox("error", e.message || "Couldn't close ticket.");
  } finally { btn.disabled = false; btn.textContent = "Close ticket (no reply)"; }
});

$("sendReplyBtn").addEventListener("click", async () => {
  const body = $("replyBody").value.trim();
  if (!body || !activeTicketId) return;
  const internal = $("internalChk").checked;
  const status = internal ? undefined : selectedStatus();
  const btn = $("sendReplyBtn"); btn.disabled = true; btn.textContent = "Sending…";
  try {
    await ADMIN.api("reply_support_ticket", { ticket_id: activeTicketId, body, internal, status });
    $("replyBody").value = ""; $("internalChk").checked = false;
    document.getElementById("statusRow").classList.remove("is-internal");
    document.querySelectorAll('input[name="newStatusRadio"]').forEach(r => { r.disabled = false; });
    resetStatusToDefault();
    await openThread(activeTicketId);
    await loadList();
  } catch (e) {
    alertBox("error", e.message || "Couldn't send reply.");
  } finally { btn.disabled = false; btn.textContent = "Send reply"; }
});

// Boot
await loadList();
if (activeTicketId) openThread(activeTicketId);
else showView("list");
</script>
</body>
</html>
