<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A4D3C">
  <title>Tenants — easierLet Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>

<div id="admin-header"></div>

<main class="admin-main">
  <div class="page-head">
    <h1>Tenants</h1>
    <div class="sub">Every tenant across all landlords. Search by name, email, property address, or landlord.</div>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="card">
    <div class="card-head">
      <div>
        <div class="card-title" id="cardTitle">All tenants</div>
        <div class="card-sub">Newest first.</div>
      </div>
    </div>
    <div class="field-row" style="grid-template-columns: 1fr auto; gap: 10px;">
      <input type="search" id="searchInput" placeholder="Tenant name, email, address, postcode, landlord…" autofocus />
      <button class="btn btn-primary" id="searchBtn">Search</button>
    </div>
    <div id="rows" style="margin-top:14px"><div class="spinner"></div></div>
  </div>
</main>

<script type="module">
  import "/assets/admin.js?v=8";
  const ADMIN = window.ADMIN;
  const $ = (id) => document.getElementById(id);

  const admin = await ADMIN.requireAdminSession();
  if (!admin) throw new Error("redirecting");
  ADMIN.mountHeader("dashboard", admin);

  function alertBox(kind, msg) { const a = $("alertBox"); a.className = `alert ${kind}`; a.textContent = msg; }

  function statusPill(s) {
    if (!s) return `<span class="pill pill-grey">—</span>`;
    const map = {
      active: "green", awaiting_review: "blue", referencing: "blue",
      approved: "green", submitted: "blue",
      archived: "grey", rejected: "red", declined: "red",
    };
    return `<span class="pill pill-${map[s] || 'grey'}">${ADMIN.esc(s.replace(/_/g, ' '))}</span>`;
  }

  async function load(search = "") {
    $("rows").innerHTML = `<div class="spinner"></div>`;
    try {
      const data = await ADMIN.api("list_admin_tenants", { search });
      const items = data.items || [];
      $("cardTitle").textContent = search
        ? `${items.length} match${items.length === 1 ? "" : "es"} for "${search}"`
        : `${items.length} tenant${items.length === 1 ? "" : "s"}`;
      if (!items.length) {
        $("rows").innerHTML = `<div class="empty">${search ? `Nothing matches "${ADMIN.esc(search)}".` : "No tenants yet."}</div>`;
        return;
      }
      $("rows").innerHTML = `
        <table class="table">
          <thead>
            <tr>
              <th>Tenant</th><th>Role</th><th>Property</th>
              <th>Landlord</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody>${items.map((t) => {
            const ll = t.landlord || {};
            const llName = ll.director_name || ll.contact_email || "—";
            const llHref = `/landlord.html?id=${ADMIN.esc(t.user_id)}`;
            const prop = t.property || {};
            const addr = [prop.address_line1, prop.city, prop.postcode].filter(Boolean).join(", ") || "—";
            const tenName = t.full_name || t.name || "—";
            return `
              <tr>
                <td><div>${ADMIN.esc(tenName)}</div>${t.email ? `<small style="color:var(--el-muted)">${ADMIN.esc(t.email)}</small>` : ""}</td>
                <td>${t.role ? `<code style="font-size:12px">${ADMIN.esc(t.role)}</code>` : "—"}</td>
                <td>${ADMIN.esc(addr)}</td>
                <td><a href="${llHref}">${ADMIN.esc(llName)}</a>${ll.contact_email ? `<br><small style="color:var(--el-muted)">${ADMIN.esc(ll.contact_email)}</small>` : ""}</td>
                <td>${statusPill(t.status)}</td>
                <td><a class="btn btn-secondary" href="${llHref}">Open landlord</a></td>
              </tr>`;
          }).join("")}</tbody>
        </table>
      `;
    } catch (e) {
      alertBox("error", e.message || "Failed to load tenants.");
    }
  }

  $("searchBtn").addEventListener("click", () => load($("searchInput").value.trim()));
  $("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); load($("searchInput").value.trim()); }
  });

  const q0 = new URLSearchParams(location.search).get("q") ?? "";
  if (q0) $("searchInput").value = q0;
  load(q0);
</script>

</body>
</html>
